  name: cart
  namespace: flexascale-bookstore
  labels: {app: cart, app.kubernetes.io/part-of: bookstore}
spec:
  replicas: 1
  selector: {matchLabels: {app: cart}}
  template:
    metadata:
      labels: {app: cart, app.kubernetes.io/part-of: bookstore}
    spec:
      containers:
        - name: cart
          image: bookstore-svc:1.0
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SERVICE_NAME, value: cart}
            - {name: WORK_MS, value: "6"}
            - name: ROUTES
              valueFrom: {configMapKeyRef: {name: bookstore-topology, key: cart}}
          resources:
            requests: {cpu: 100m, memory: 48Mi}
            limits: {cpu: 300m, memory: 96Mi}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: flexascale-bookstore
  labels: {app: cart, app.kubernetes.io/part-of: bookstore}
spec:
  selector: {app: cart}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cart
  namespace: flexascale-bookstore
  labels: {app: cart, app.kubernetes.io/part-of: bookstore}
