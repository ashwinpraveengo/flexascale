server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API Gateway. The name is resolved per request (not once at
    # start-up), so nginx no longer crash-loops when it starts before cluster DNS is ready.
    # ${NGINX_LOCAL_RESOLVERS} and ${API_GATEWAY_HOST} are filled in by the nginx image's
    # template step (see Dockerfile).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $api_gateway http://${API_GATEWAY_HOST}:8000;

    location /api/ {
        proxy_pass $api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
