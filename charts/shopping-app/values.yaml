# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          service: api-gateway
          port: 8000
        - path: /metrics
          pathType: Prefix
          service: api-gateway
          port: 8000
        - path: /
          pathType: Prefix
          service: shopping-frontend
          port: 80
    - host: shopping.local
      paths:
        - path: /api
          pathType: Prefix
          service: api-gateway
          port: 8000
        - path: /metrics
          pathType: Prefix
          service: api-gateway
          port: 8000
        - path: /
          pathType: Prefix
          service: shopping-frontend
          port: 80

# Prometheus Monitoring
monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    labels:
      release: prometheus
