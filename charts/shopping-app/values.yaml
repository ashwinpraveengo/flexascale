# Default values for shopping-app.
namespace: flexascale-apps
createNamespace: false

# Global settings
global:
  imagePullPolicy: IfNotPresent
  environment: production

# PostgreSQL Persistence
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  port: 5432
  auth:
    username: postgres
    password: postgresPassword123!
    database: ecommerce
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  maxConnections: 300               # shared by 16 services and all their replicas
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

# Secrets
security:
  jwtSecret: "super-secret-production-jwt-key-for-shopping-app-2026"

# Microservices Definitions
services:
  apiGateway:
    name: api-gateway
    replicas: 1
    image:
      repository: api-gateway
      tag: "1.2"
    port: 8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    probes:
      livenessPath: /healthz
      readinessPath: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10

  userService:
    name: user-service
    replicas: 1
    image:
      repository: user-service
      tag: latest
    port: 8001
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
