apiVersion: v1
kind: Secret
metadata:
  name: shopping-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shopping-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  JWT_SECRET: {{ .Values.security.jwtSecret | quote }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@postgres:5432/{{ .Values.postgresql.auth.database }}"
