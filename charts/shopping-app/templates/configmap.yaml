apiVersion: v1
kind: ConfigMap
metadata:
  name: shopping-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "shopping-app.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: {{ .Values.postgresql.port | quote }}
  USER_SERVICE_URL: "http://user-service:8001"
  CATALOG_SERVICE_URL: "http://catalog-service:8002"
  CART_SERVICE_URL: "http://cart-service:8003"
  ORDER_SERVICE_URL: "http://order-service:8004"
  INVENTORY_SERVICE_URL: "http://inventory-service:8005"
  PAYMENT_SERVICE_URL: "http://payment-service:8006"
  HTTP_TIMEOUT: "6.0"
  SIMULATE_FAILURE_RATE: {{ .Values.services.paymentService.config.simulateFailureRate | quote }}
  PAYMENT_DEFAULT_DELAY_MS: {{ .Values.services.paymentService.config.defaultDelayMs | quote }}
