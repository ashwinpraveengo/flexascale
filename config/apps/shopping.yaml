# FlexaScale application policy: bundled e-commerce demo (7 FastAPI services).
# The shopping app is an *example* workload: everything application-specific
# (namespace, names, topology) lives in this file, not in FlexaScale's code.
name: shopping
namespace: flexascale-apps
label_selector: ""
include: []                      # empty = every eligible Deployment in the namespace
exclude: [shopping-frontend]     # static nginx site, not part of the request path being scaled
exclude_datastores: true         # postgres is skipped automatically (image name)

mode: observe                    # observe | live  (live must be enabled explicitly)

min_replicas: 1
max_replicas: 10                 # matches the native HPAs and the trained model's replica range
max_step: 1
max_total_replicas: 28           # app-wide budget: the Minikube node is a 6 GiB container (see readiness report)
services: {}

cpu_target_pct: 70
scale_down_block_cpu_pct: 85
scale_down_block_memory_pct: 90
slo_latency_ms: 250              # mean per-service latency SLO

confidence_threshold: 0.70
deactivation_threshold: 0.60
cooldown_seconds: 15
scale_up_cooldown_seconds: 30      # telemetry is a 1-minute rate; wait until the last scale-up is visible
scale_down_cooldown_seconds: 60
hpa_fallback: true
lease_seconds: 30

poll_interval_seconds: 10
stale_after_seconds: 120
prometheus_url: http://localhost:9090
model_path: models/flexascale_v4/best_model/best_model.zip

# Known call graph (caller -> callee) from the application's architecture.
topology:
  - [api-gateway, user-service]
  - [api-gateway, catalog-service]
  - [api-gateway, cart-service]
  - [api-gateway, order-service]
  - [cart-service, catalog-service]
  - [cart-service, inventory-service]
  - [order-service, catalog-service]
  - [order-service, inventory-service]
  - [order-service, payment-service]
  - [order-service, cart-service]

cost:
  currency: USD
  cpu_per_vcpu_hour: null        # set both prices to report money; null = normalized proxy
  memory_per_gib_hour: null
  memory_weight: 0.125
