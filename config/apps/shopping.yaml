# FlexaScale application policy: bundled e-commerce demo (16 FastAPI services).
# The shopping app is an *example* workload: everything application-specific
# (namespace, names, topology) lives in this file, not in FlexaScale's code.
name: shopping
namespace: flexascale-apps
label_selector: ""
include: []                      # empty = every eligible Deployment in the namespace
exclude: [shopping-frontend]     # static nginx site, not part of the request path being scaled
exclude_datastores: true         # postgres is skipped automatically (image name)

mode: observe                    # observe | live  (live must be enabled explicitly)

min_replicas: 1
max_replicas: 10                 # matches the native HPAs and the trained model's replica range
max_step: 1
max_total_replicas: 48           # app-wide budget: 16 services on a 9 GiB Minikube node (see readiness report)
services: {}

cpu_target_pct: 70
scale_down_block_cpu_pct: 85
scale_down_block_memory_pct: 90
slo_latency_ms: 250              # mean per-service latency SLO

confidence_threshold: 0.70
deactivation_threshold: 0.60
cooldown_seconds: 15
scale_up_cooldown_seconds: 30      # telemetry is a 1-minute rate; wait until the last scale-up is visible
scale_down_cooldown_seconds: 60
hpa_fallback: true
lease_seconds: 30

poll_interval_seconds: 10
stale_after_seconds: 120
prometheus_url: http://localhost:9090
model_path: models/flexascale_v5/best_model/best_model.zip

# Known call graph (caller -> callee) from the application's architecture.
topology:
  - [api-gateway, user-service]
  - [api-gateway, catalog-service]
  - [api-gateway, cart-service]
  - [api-gateway, order-service]
  - [cart-service, catalog-service]
  - [cart-service, inventory-service]
  - [order-service, catalog-service]
  - [order-service, inventory-service]
  - [order-service, payment-service]
  - [order-service, cart-service]
  - [order-service, shipping-service]
  - [order-service, fraud-service]
  - [order-service, notification-service]
  - [cart-service, pricing-service]
  - [api-gateway, search-service]
  - [api-gateway, recommendation-service]
  - [api-gateway, review-service]
  - [api-gateway, wishlist-service]
  - [api-gateway, shipping-service]
  - [search-service, catalog-service]
  - [search-service, pricing-service]
  - [pricing-service, promotion-service]
  - [recommendation-service, catalog-service]
  - [recommendation-service, review-service]
  - [wishlist-service, catalog-service]

cost:
  currency: USD
  # Estimate only (Minikube has no bill): AWS Fargate on-demand list prices, Linux/x86, us-east-1,
  # applied to the CPU/memory *requested* by ready replicas. Set both to null for the unitless proxy.
  cpu_per_vcpu_hour: 0.04048
  memory_per_gib_hour: 0.004445
  memory_weight: 0.125
  label: "estimated at AWS Fargate on-demand list prices (us-east-1), not a bill"

# Auto mode (operator --auto / dashboard "Auto"): per-service FlexaScale-or-HPA rules, operator/auto_mode.py
auto:
  sla_latency_ratio: 1.0         # SLA risk above 1.0 x slo_latency_ms (mean latency per service)
  cpu_risk_pct: 85               # ... or at/above this CPU % of request
  dwell_steps: 2                 # consecutive steps before switching to FlexaScale (hand-backs to HPA on risk are immediate)
