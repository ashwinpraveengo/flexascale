# FlexaScale application policy: the shop with the hand-written rule limit_target(0.6/0.3) instead of a model (attribution arm) (docs/POLICY_V7.md §4).
# Generated by scripts/promote_v7.py from config/apps/shopping.yaml; only the controller settings differ.
# Guards match the twin the policy was trained in (simulator/twin_control.V7_GUARDS):
#   up to +3 replicas per decision, 20 s between scale-ups, one replica down per 30 s, never scale down a pod at
#   >= 80% of its 500m CPU limit (400% of request). No single latency SLO: v7 reads each service's latency
#   relative to its own low-load latency. The confidence gate is off (thresholds 0): v7 was trained without one,
#   its action probabilities are not calibrated confidences, and a gate would hand services to HPA in the
#   RL-only arm. Health fallback (missing/stale telemetry, lost Lease, operator error) still returns a service
#   to native HPA.
name: shopping
namespace: flexascale-apps
label_selector: app.kubernetes.io/part-of=flexascale-ecommerce   # the shop chart's Deployments only (not other workloads in the namespace)
include: []
exclude: [shopping-frontend]
exclude_datastores: true
mode: observe
min_replicas: 1
max_replicas: 10
max_step: 3
max_total_replicas: 48
services: {}
cpu_target_pct: 70
scale_down_block_cpu_pct: 400.0
scale_down_block_memory_pct: 90
slo_latency_ms: null
confidence_threshold: 0.0
deactivation_threshold: 0.0
cooldown_seconds: 15
scale_up_cooldown_seconds: 20.0
scale_down_cooldown_seconds: 30.0
hpa_fallback: true
lease_seconds: 30
poll_interval_seconds: 10
stale_after_seconds: 120
prometheus_url: http://localhost:9090
model_path: models/flexascale_v7/best_model/best_model.zip
topology:
- [api-gateway, user-service]
- [api-gateway, catalog-service]
- [api-gateway, cart-service]
- [api-gateway, order-service]
- [cart-service, catalog-service]
- [cart-service, inventory-service]
- [order-service, catalog-service]
- [order-service, inventory-service]
- [order-service, payment-service]
- [order-service, cart-service]
- [order-service, shipping-service]
- [order-service, fraud-service]
- [order-service, notification-service]
- [cart-service, pricing-service]
- [api-gateway, search-service]
- [api-gateway, recommendation-service]
- [api-gateway, review-service]
- [api-gateway, wishlist-service]
- [api-gateway, shipping-service]
- [search-service, catalog-service]
- [search-service, pricing-service]
- [pricing-service, promotion-service]
- [recommendation-service, catalog-service]
- [recommendation-service, review-service]
- [wishlist-service, catalog-service]
cost: {currency: USD, cpu_per_vcpu_hour: 0.04048, memory_per_gib_hour: 0.004445, memory_weight: 0.125,
  label: 'estimated at AWS Fargate on-demand list prices (us-east-1), not a bill'}
auto: {sla_latency_ratio: 1.0, cpu_risk_pct: 400.0, dwell_steps: 2, hpa_target_pct: 250.0}
max_scale_down_step: 1
controller_rule: {type: limit_target, target: 0.6, down: 0.3}
