{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexascale.labels" . | nindent 4 }}
---
# Namespaced and least-privilege: only the target application's namespace.
# Write verbs are granted only when policy.mode is "live".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Values.policy.namespace }}
  labels:
    {{- include "flexascale.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    # patch (live only): records the original replica count of HPA-less Deployments.
    verbs: ["get", "list", "watch"{{ if eq .Values.policy.mode "live" }}, "patch"{{ end }}]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"{{ if eq .Values.policy.mode "live" }}, "patch"{{ end }}]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get"{{ if eq .Values.policy.mode "live" }}, "create", "update"{{ end }}]
{{- if eq .Values.policy.mode "live" }}
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["flexascale-{{ .Values.policy.name }}-ownership"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Values.policy.namespace }}
  labels:
    {{- include "flexascale.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
