{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexascale-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: flexascale
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: flexascale
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flexascale
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: flexascale-operator
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command:
            - python3
            - scripts/run_operator.py
            - --live
            - --interval
            - "{{ .Values.operator.interval }}"
            - --threshold
            - "{{ .Values.operator.threshold }}"
            - --model-path
            - "{{ .Values.operator.modelPath }}"
          envFrom:
            - configMapRef:
                name: flexascale-config
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}
