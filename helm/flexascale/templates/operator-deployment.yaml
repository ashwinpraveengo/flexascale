{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flexascale.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1               # one controller per application; the Lease enforces this anyway
  strategy:
    type: Recreate          # never run old and new operator side by side
  selector:
    matchLabels:  # same selector as chart 0.1.0: Deployment selectors are immutable, keeps upgrades working
      app.kubernetes.io/name: flexascale
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "flexascale.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      annotations:
        checksum/policy: {{ toYaml .Values.policy | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      terminationGracePeriodSeconds: {{ .Values.operator.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --policy
            - /etc/flexascale/policy.yaml
            - --decision-log
            - /var/log/flexascale/decisions.jsonl
            - --status-file
            - /var/log/flexascale/status.json
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - {name: policy, mountPath: /etc/flexascale, readOnly: true}
            - {name: logs, mountPath: /var/log/flexascale}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
      volumes:
        - name: policy
          configMap: {name: {{ .Release.Name }}-policy}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
{{- end }}
